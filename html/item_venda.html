<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item da Venda</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav>
        <div class="logo">🎮 Goku Games</div>

        <div class="links-menu">
            <a href="../index.html">Início</a>
            <a href="../html/funcionario.html">Funcionário</a>
            <a href="../html/venda">Venda</a>
            <a href="../html/item_venda.html">Item da Venda</a>
        </div>
    </nav>

    <main class="container">

        <h1>Cadastro de Item da Venda</h1>

        <p class="subtitulo">
            Adicione um jogo a uma venda
        </p>

        <form id="formItemVenda">

            <label for="venda">Venda associada</label>
            <input
                type="text"
                id="venda"
                name="venda"
                required
            >

            <label for="jogo">Jogo selecionado</label>
            <input
                type="text"
                id="jogo"
                name="jogo"
                required
            >

            <label for="quantidade">Quantidade</label>
            <input
                type="number"
                id="quantidade"
                name="quantidade"
                min="1"
                step="1"
                required
            >

            <label for="preco">Preço unitário</label>
            <input
                type="number"
                id="preco"
                name="preco"
                min="0.01"
                step="0.01"
                required
            >

            <label for="desconto">Desconto</label>
            <input
                type="number"
                id="desconto"
                name="desconto"
                min="0"
                step="0.01"
                value="0"
                required
            >

            <label for="subtotal">Subtotal</label>
            <input
                type="text"
                id="subtotal"
                name="subtotal"
                value="R$ 0,00"
                readonly
            >

            <button type="submit">
                Adicionar item
            </button>

            <p id="resultado" class="resultado" role="status"></p>

        </form>

    </main>

    <script src="../js/item_venda.js"></script>

</body>
</html>
