<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Jogo - Loja de Games</title>

    <link rel="stylesheet" href="../css/style.css">
    
</head>

<body>


    
    <nav>
        <div class="logo">
            🎮 Goku Games
        </div>

        <div class="links-menu">

            <a href="../index.html">Início</a>

            <a href="../html/cliente.html">Clientes</a>

            <a href="../html/jogo.html">Jogos</a>

            <a href="../html/plataforma.html">Plataformas</a>

            <a href="../html/categoria.html">Categorias</a>


        </div>

    </nav>


    <div class="container">

        <div class="formulario">


            <h1>Cadastro de Jogo</h1>

            

                <form id="formJogo">

                    <label>Nome do jogo:</label>
                    <input type="text" id="nome" name="nome">

                    <label>Descrição detalhada:</label>
                    <textarea id="descricao" name="descricao"></textarea>

                    <label>Preço unitário:</label>
                    <input type="number" step="0.01" id="preco" name="preco">

                    <label>Data de lançamento:</label>
                    <input type="date" id="dataLancamento" name="dataLancamento">

                    <label>Classificação indicativa:</label>
                    <input type="text" id="classificacao" name="classificacao">

                    <label>Desenvolvedora/Studio:</label>
                    <input type="text" id="desenvolvedora" name="desenvolvedora">

                    <button type="submit">
                        Cadastrar Jogo
                    </button>

                </form>

            


            <div id="resultado"></div>

        </div>

       

    </div>

    <script src="../js/jogo.js"></script>

</body>

</html>
