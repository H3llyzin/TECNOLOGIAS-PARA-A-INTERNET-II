
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Estoque - Goku Games</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav>
        <div class="logo">
            🎮 Goku Games
        </div>

        <div class="links-menu">
            <a href="../index.html">Início</a>
            <a href="cliente.html">Clientes</a>
            <a href="jogo.html">Jogos</a>
            <a href="estoque.html">Estoque</a>
            <a href="categoria.html">Categorias</a>
            <a href="venda.html">Vendas</a>
            <a href="funcionario.html">Funcionário</a>
            <a href="item_venda.html">Itens</a>
        </div>
    </nav>

    <main class="container">

        <h1>Cadastro de Estoque</h1>

        <form id="formEstoque">

            
            <label for="nomeJogo">Nome do jogo:</label>
            <input type="text" id="nomeJogo" name="nomeJogo" required>

            <label for="quantidade">Quantidade em estoque:</label>
            <input type="number" id="quantidade" name="quantidade"
                min="0" step="1" required>

            <label for="estoqueMinimo">Estoque mínimo:</label>
            <input type="number" id="estoqueMinimo" name="estoqueMinimo"
                min="0" step="1" required>

            <label for="precoCusto">Preço de custo:</label>
            <input type="number" id="precoCusto" name="precoCusto"
                min="0.01" step="0.01" required>

            <label for="quantidadeReservada">Quantidade reservada:</label>
            <input type="number" id="quantidadeReservada" name="quantidadeReservada"
                min="0" step="1" required>



            <button type="submit">
                Cadastrar Estoque
            </button>

            <div id="resultado" class="resultado"
                style="white-space: pre-line;"></div>

        </form>

    </main>

    <script src="../js/estoque.js"></script>

</body>
</html>
