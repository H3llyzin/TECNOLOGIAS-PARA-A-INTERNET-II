<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionário</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <nav>
        <div class="logo">🎮 Goku Games</div>

        <div class="links-menu">
            <a href="../index.html">Início</a>
            <a href="../html/funcionario.html">Funcionário</a>
            <a href="../html/venda.html">Venda</a>
            <a href="../html/item_venda.html">Item da Venda</a>
        </div>
    </nav>
    <main class="container">

        <h1>Cadastro de Funcionário</h1>

        <p class="subtitulo">
            Cadastre um novo funcionário da loja
        </p>

        <form id="formFuncionario">

            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                name="nome"
                maxlength="120"
                required
            >

            <label for="cpf">CPF</label>
            <input
                type="text"
                id="cpf"
                name="cpf"
                maxlength="14"
                placeholder="000.000.000-00"
                required
            >

            <label for="nascimento">Data de nascimento</label>
            <input
                type="date"
                id="nascimento"
                name="nascimento"
                required
            >

            <label for="telefone">Telefone</label>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                maxlength="20"
                required
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                maxlength="150"
                required
            >

            <label for="cargo">Cargo</label>
            <input
                type="text"
                id="cargo"
                name="cargo"
                maxlength="80"
                required
            >

            <button type="submit">
                Cadastrar funcionário
            </button>

            <p id="resultado" class="resultado" role="status"></p>

        </form>

    </main>

    <script src="../js/funcionario.js"></script>

</body>
</html>
